name: Deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site if uploaded as zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done || true
          I=$(find . -name index.html -not -path './.git/*' | head -1)
          echo "SITE_DIR=$(dirname "$I")" >> $GITHUB_ENV
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
